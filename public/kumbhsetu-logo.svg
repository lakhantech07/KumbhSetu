<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbb72c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- River Water Gradients -->
    <linearGradient id="riverDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3261"/>
      <stop offset="100%" stop-color="#14427b"/>
    </linearGradient>

    <linearGradient id="riverLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e5fa0"/>
      <stop offset="100%" stop-color="#2a7ac4"/>
    </linearGradient>

    <!-- Clip path to keep emblem circular -->
    <clipPath id="emblemClip">
      <circle cx="300" cy="225" r="175"/>
    </clipPath>
  </defs>

  <g id="emblem-group" clip-path="url(#emblemClip)">
    <!-- 1. Background Saffron/Golden Sun -->
    <circle cx="300" cy="225" r="175" fill="url(#sunGrad)"/>

    <!-- 2. Flying Birds in Sky -->
    <g fill="#0f3261">
      <!-- Upper bird -->
      <path d="M 368 152 Q 380 146 392 153 Q 404 146 416 152 Q 402 157 392 154 Q 382 157 368 152 Z"/>
      <!-- Lower bird -->
      <path d="M 390 170 Q 400 165 410 171 Q 420 165 430 170 Q 418 174 410 172 Q 402 174 390 170 Z"/>
    </g>

    <!-- 3. Temple Shikhara & Fluttering Flag (Navy Silhouette with Orange Flag) -->
    <!-- Flagpole & Saffron Flag -->
    <rect x="298" y="45" width="4" height="60" fill="#0f3261"/>
    <path d="M 302 48 Q 325 58 355 62 Q 330 78 302 75 Z" fill="#f37021"/>

    <!-- Kalash & Spire Finial -->
    <path d="M 295 105 L 300 85 L 305 105 Z" fill="#0f3261"/>
    <circle cx="300" cy="106" r="6" fill="#0f3261"/>
    <circle cx="300" cy="116" r="9" fill="#0f3261"/>

    <!-- Temple Main Dome -->
    <path d="M 265 180 C 265 135 282 122 300 122 C 318 122 335 135 335 180 Z" fill="#0f3261"/>
    <!-- Dome Base & Cornice -->
    <rect x="255" y="176" width="90" height="12" rx="4" fill="#0f3261"/>
    <path d="M 245 198 L 255 188 L 345 188 L 355 198 Z" fill="#0f3261"/>

    <!-- Mini Side Spires -->
    <path d="M 248 188 C 248 165 255 160 260 160 C 265 160 268 168 268 188 Z" fill="#0f3261"/>
    <path d="M 332 188 C 332 168 335 160 340 160 C 345 160 352 165 352 188 Z" fill="#0f3261"/>

    <!-- 4. Crowd of Pilgrims / Devotees Walking on the Bridge Flanks -->
    <g fill="#0f3261">
      <!-- Left side crowd -->
      <circle cx="150" cy="225" r="10"/><path d="M 140 245 C 140 234 160 234 160 245 Z"/>
      <circle cx="166" cy="214" r="11"/><path d="M 155 238 C 155 225 177 225 177 238 Z"/>
      <circle cx="184" cy="202" r="12"/><path d="M 172 230 C 172 216 196 216 196 230 Z"/>
      <circle cx="204" cy="190" r="13"/><path d="M 191 220 C 191 205 217 205 217 220 Z"/>
      <circle cx="226" cy="180" r="14"/><path d="M 212 212 C 212 195 240 195 240 212 Z"/>

      <!-- Right side crowd -->
      <circle cx="374" cy="180" r="14"/><path d="M 360 212 C 360 195 388 195 388 212 Z"/>
      <circle cx="396" cy="190" r="13"/><path d="M 383 220 C 383 205 409 205 409 220 Z"/>
      <circle cx="416" cy="202" r="12"/><path d="M 404 230 C 404 216 428 216 428 230 Z"/>
      <circle cx="434" cy="214" r="11"/><path d="M 423 238 C 423 225 445 225 445 238 Z"/>
      <circle cx="450" cy="225" r="10"/><path d="M 440 245 C 440 234 460 234 460 245 Z"/>
    </g>

    <!-- 5. Grand Arched Bridge Structure -->
    <!-- Bridge Span Bed -->
    <path d="M 120 270 Q 300 175 480 270 L 480 320 Q 300 240 120 320 Z" fill="#0f3261"/>

    <!-- Central Grand Arch Opening (White negative space) -->
    <path d="M 235 320 C 235 220 365 220 365 320 Q 300 275 235 320 Z" fill="#ffffff"/>

    <!-- Bridge Pillars / Supports (Navy) -->
    <rect x="220" y="240" width="18" height="80" fill="#0f3261"/>
    <rect x="260" y="220" width="14" height="100" fill="#0f3261"/>
    <rect x="326" y="220" width="14" height="100" fill="#0f3261"/>
    <rect x="362" y="240" width="18" height="80" fill="#0f3261"/>

    <!-- 6. Sacred River Swirls & Waves (Triveni Sangam flowing under bridge) -->
    <!-- Deep Blue River Base -->
    <path d="M 120 280 Q 300 220 480 280 L 480 410 Q 300 410 120 410 Z" fill="url(#riverDeep)"/>

    <!-- Primary Center Stream Swirl (Flowing towards viewer) -->
    <path d="M 300 270 C 270 290 280 315 250 330 C 210 350 180 340 140 370 C 200 410 320 420 460 380 C 430 335 350 340 335 315 C 325 295 340 285 300 270 Z" fill="#184f8d"/>

    <!-- Dynamic Flowing White Water Ribbons -->
    <path d="M 298 273 C 275 290 285 315 255 330 C 220 347 185 342 155 372 C 168 376 195 365 240 352 C 275 342 272 320 295 305 C 315 292 312 282 298 273 Z" fill="#ffffff"/>

    <!-- Lower Flowing Ribbon (Cyan/Light Blue) -->
    <path d="M 175 390 C 240 345 320 365 440 355 C 410 370 330 380 230 405 C 200 402 185 396 175 390 Z" fill="#2d77bc"/>

    <!-- Secondary Wave Highlights -->
    <path d="M 210 375 Q 310 340 410 360 Q 320 360 210 375 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 240 325 Q 320 295 360 320 Q 310 312 240 325 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- 7. Brand Wordmark: "KumbhSetu" -->
  <g id="brand-text">
    <text x="50" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="86" letter-spacing="-1">
      <tspan fill="#0a2e5c">Kumbh</tspan><tspan fill="#f37021">Setu</tspan>
    </text>
  </g>
</svg>
